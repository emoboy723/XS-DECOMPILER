name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - name: Functional tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD/src"
          python -m unittest discover -s src -p ai_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p check_external_tools.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p check_combined.py
          exit $LASTEXITCODE
      - name: Build desktop application
        shell: pwsh
        run: ./CONSTRUIR.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Strata-desktop-without-engines
          path: compiled/Strata/
